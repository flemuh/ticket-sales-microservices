services:
  frontend:
    build: ./frontend
    container_name: react_app
    ports:
      - "5173:5173"
    depends_on:
      php :
        condition: service_started
      mysql:
        condition: service_healthy
      python_api:
        condition: service_started

  php:
    build: ./vendas-service
    container_name: php_sales
    ports:
      - "8000:80"
    depends_on:
      mysql:
        condition: service_healthy
      python_api:
        condition: service_started
      python_worker:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_NAME: vendas_db
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}

  python_api:
    build:
      context: ./catalogo-service
      dockerfile: Dockerfile
    container_name: python_api
    command: python main.py
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_NAME: catalogo_db
      DB_PASSWORD: root
      DB_USER: root
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET}

  python_worker:
    build:
      context: ./catalogo-service
      dockerfile: Dockerfile
    container_name: python_worker
    command: python -u consumer.py
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_NAME: catalogo_db
      DB_PASSWORD: root
      DB_USER: root
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET}

  mysql:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  mysql_data: